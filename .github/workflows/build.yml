name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake ninja-build

      - name: Set App Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure CMake
        run: |
          ./vcpkg/bootstrap-vcpkg.sh
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/mingw-toolchain.cmake -DVCPKG_TARGET_TRIPLET=x64-mingw-static -DAPP_VERSION="${{ steps.version.outputs.version }}"

      - name: Build and Generate Scripts
        run: cmake --build build --config Release

      - name: Package with CPack
        run: |
          cd build
          cpack

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cheetos-release-zip
          path: build/TBH-Cheetos-v*.zip
