name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  release:
    name: Manage GitHub Release
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Release Artifact
        uses: actions/download-artifact@v8
        with:
          name: cheetos-release-zip
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Manage Major Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # In workflow_run events, the head_branch is the name of the tag (e.g. v2.1.3)
          TAG="${{ github.event.workflow_run.head_branch }}"
          # Extract major version e.g. "v2" from "v2.1.3"
          MAJOR_VERSION=$(echo "$TAG" | cut -d'.' -f1)

          echo "Processing for Major Version: $MAJOR_VERSION"

          # Find the previous tag to determine the commit range
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMIT_RANGE="$TAG"
          else
            COMMIT_RANGE="$PREV_TAG..$TAG"
          fi

          # Generate custom release notes filtering by specific directories/files
          NOTES=$(git log $COMMIT_RANGE --pretty=format:"* %s (%h)" -- src/ vcpkg/ CMakeLists.txt cmake/ vcpkg.json)

          if [ -z "$NOTES" ]; then
            NOTES="* No source code or build configuration changes in this release."
          fi

          # Generate full release notes without path filters
          FULL_NOTES=$(git log $COMMIT_RANGE --pretty=format:"* %s (%h)")

          if [ -z "$FULL_NOTES" ]; then
            FULL_NOTES="### $TAG
          * No changes."
          else
            FULL_NOTES="### $TAG
          $FULL_NOTES"
          fi

          # Generate GitHub compare link
          if [ -z "$PREV_TAG" ]; then
            COMPARE_LINK="https://github.com/${{ github.repository }}/commits/$TAG"
          else
            COMPARE_LINK="https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
          fi

          # Fetch existing release body to preserve previous changelogs
          EXISTING_BODY=$(gh release view "$MAJOR_VERSION" --json body -q .body 2>/dev/null || echo "")

          # Extract old Source Changes, skipping the current TAG if it already exists (in case of a force-push)
          OLD_SOURCE_CHANGES=$(echo "$EXISTING_BODY" | awk -v tag="$TAG" '
            /^## Source Changes/ { if ($0 == "## Source Changes for " tag) skip = 1; else { skip = 0; flag = 1 } }
            /^## Full Changelog/ { flag = 0; skip = 0 }
            flag && !skip { print }
          ')

          # Extract old Full Changelog, skipping the current TAG if it exists
          OLD_FULL_NOTES=$(echo "$EXISTING_BODY" | awk -v tag="$TAG" '
            /^<summary>/ { flag = 1; next }
            /^### / { if ($0 == "### " tag) skip = 1; else skip = 0 }
            /^<\/details>/ { flag = 0 }
            flag && !skip { print }
          ')

          # Construct the new release body
          BODY="Latest build for **$MAJOR_VERSION** (Currently tracking \`$TAG\`)

          ## Source Changes for $TAG
          $NOTES

          $OLD_SOURCE_CHANGES

          ## Full Changelog
          <details>
          <summary>Click to view full changelog</summary>

          $FULL_NOTES
          $OLD_FULL_NOTES

          </details>

          **Full Commit History**: $COMPARE_LINK"

          # Create the release for this major version (fails gracefully if it already exists)
          gh release create "$MAJOR_VERSION" --title "Cheetos $MAJOR_VERSION" --notes "$BODY" || true

          # Update release notes to reflect the latest tag and changelog
          gh release edit "$MAJOR_VERSION" --title "Cheetos $MAJOR_VERSION" --notes "$BODY"

          # Extract version from vcpkg.json
          PROJECT_VERSION=$(jq -r .version vcpkg.json)

          # Upload the new binaries, overwriting old ones
          gh release upload "$MAJOR_VERSION" build/TBH-Cheetos-v${PROJECT_VERSION}.zip --clobber

          # Archive older major versions
          ALL_RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName')
          for rel in $ALL_RELEASES; do
            # Skip the current major version
            if [ "$rel" != "$MAJOR_VERSION" ]; then
              # Check if it doesn't contain 'Archived'
              TITLE=$(gh release view "$rel" --json name -q '.name')
              if [[ "$TITLE" != *"Archived"* ]]; then
                echo "Archiving older major release: $rel"
                gh release edit "$rel" --title "$rel (Archived)"
              fi
            fi
          done

      - name: Cleanup Old Tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          MAJOR_VERSION=$(echo "$TAG" | cut -d'.' -f1)

          echo "Cleaning up old tags for active major version: $MAJOR_VERSION"

          # Fetch all tags
          git fetch --tags

          # Get all specific tags for the current major version (e.g. v2.*)
          # We use sort -V to sort by version numbers
          SPECIFIC_TAGS=$(git tag -l "${MAJOR_VERSION}.*" | sort -V)

          # Convert to array
          TAGS_ARRAY=($SPECIFIC_TAGS)
          TAGS_COUNT=${#TAGS_ARRAY[@]}

          echo "Found $TAGS_COUNT specific tags for $MAJOR_VERSION"

          # Keep the last 2 tags, delete the rest
          if [ "$TAGS_COUNT" -gt 2 ]; then
            DELETE_COUNT=$((TAGS_COUNT - 2))
            echo "Deleting $DELETE_COUNT older tags to keep only the latest 2..."

            for (( i=0; i<$DELETE_COUNT; i++ )); do
              TAG_TO_DELETE="${TAGS_ARRAY[$i]}"
              echo "Deleting tag: $TAG_TO_DELETE"

              # Delete tag locally and on remote
              git tag -d "$TAG_TO_DELETE" || true
              git push origin --delete "$TAG_TO_DELETE" || true

              # If there's an associated GitHub release for this specific tag, delete it too
              gh release delete "$TAG_TO_DELETE" -y || true
            done
          else
            echo "No cleanup needed. Total tags ($TAGS_COUNT) is <= 2."
          fi
