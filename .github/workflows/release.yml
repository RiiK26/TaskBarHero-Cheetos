name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install MinGW & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build zip

      - name: Extract Project Metadata
        id: meta
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('config.json'))['cheetos-version'])")
          GAME_VERSION=$(python3 -c "import json; print(json.load(open('config.json'))['game-version'])")
          STEAM_BUILD_ID=$(python3 -c "import json; print(json.load(open('config.json'))['steam-build-id'])")
          SIG_COUNT=$(python3 -c "import json; print(len(json.load(open('config.json'))['signatures']))")
          COMMIT_HASH=$(git rev-parse --short HEAD)

          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v${VERSION}"
          fi

          # Extract major version e.g. "v2" from "v2.5.3"
          MAJOR_VERSION=$(echo "$TAG" | cut -d'.' -f1)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "game_version=$GAME_VERSION" >> $GITHUB_OUTPUT
          echo "steam_build_id=$STEAM_BUILD_ID" >> $GITHUB_OUTPUT
          echo "sig_count=$SIG_COUNT" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "major=$MAJOR_VERSION" >> $GITHUB_OUTPUT

          echo "[+] Cheetos Version:      v$VERSION"
          echo "[+] Game Version:         $GAME_VERSION"
          echo "[+] Target Steam Build:   $STEAM_BUILD_ID"
          echo "[+] Tracked Signatures:   $SIG_COUNT"
          echo "[+] Release Commit:       $COMMIT_HASH"
          echo "[+] Release Tag:          $TAG"
          echo "[+] Major Release:        $MAJOR_VERSION"

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION="${{ steps.meta.outputs.tag }}"

      - name: Compile Binaries
        run: cmake --build build -j$(nproc)

      - name: Validate Binary Artifacts
        run: |
          echo "[*] Verifying build outputs in build/..."
          test -f "build/TBH-Cheetos.exe"
          test -f "build/speedhack.dll"
          ls -lh build/TBH-Cheetos.exe build/speedhack.dll

      - name: Stage Release Package & Calculate Checksums
        id: package
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          FOLDER_NAME="TBH-Cheetos"
          ZIP_NAME="TBH-Cheetos-v${VERSION}.zip"

          echo "[+] Staging files into release package: $FOLDER_NAME"
          mkdir -p "release_pkg/$FOLDER_NAME"
          cp build/TBH-Cheetos.exe "release_pkg/$FOLDER_NAME/"
          cp build/speedhack.dll "release_pkg/$FOLDER_NAME/"
          cp scripts/launch.bat "release_pkg/$FOLDER_NAME/"
          cp scripts/launch_linux.sh "release_pkg/$FOLDER_NAME/"
          cp config.json "release_pkg/$FOLDER_NAME/"
          if [ -f build/README.txt ]; then
            cp build/README.txt "release_pkg/$FOLDER_NAME/"
          fi

          chmod +x "release_pkg/$FOLDER_NAME/launch_linux.sh"

          # Generate checksums inside package
          cd "release_pkg/$FOLDER_NAME"
          sha256sum * > ../../checksums.txt
          cd ../..

          # Create distribution zip
          cd release_pkg
          zip -9 -r "../$ZIP_NAME" .
          cd ..

          ZIP_SIZE=$(ls -lh "$ZIP_NAME" | awk '{print $5}')
          ZIP_SHA=$(sha256sum "$ZIP_NAME" | awk '{print $1}')

          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "zip_size=$ZIP_SIZE" >> $GITHUB_OUTPUT
          echo "zip_sha=$ZIP_SHA" >> $GITHUB_OUTPUT

          echo "[+] Created $ZIP_NAME ($ZIP_SIZE) - SHA256: $ZIP_SHA"

      - name: Generate Release Notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          MAJOR_VERSION="${{ steps.meta.outputs.major }}"
          VERSION="${{ steps.meta.outputs.version }}"
          GAME_VERSION="${{ steps.meta.outputs.game_version }}"
          BUILD_ID="${{ steps.meta.outputs.steam_build_id }}"
          SIGS="${{ steps.meta.outputs.sig_count }}"
          COMMIT="${{ steps.meta.outputs.commit_hash }}"
          ZIP="${{ steps.package.outputs.zip_name }}"
          ZIP_SIZE="${{ steps.package.outputs.zip_size }}"
          REPO="${{ github.repository }}"

          # Find previous tag to establish commit range
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMIT_RANGE="$TAG"
            COMPARE_LINK="https://github.com/${REPO}/commits/$TAG"
          else
            COMMIT_RANGE="$PREV_TAG..$TAG"
            COMPARE_LINK="https://github.com/${REPO}/compare/$PREV_TAG...$TAG"
          fi

          # Extract concise commits targeting src/
          SRC_CHANGES=$(git log $COMMIT_RANGE --pretty=format:"* %s (%h)" -- src/ ":(exclude)src/vendor" 2>/dev/null || true)
          if [ -z "$SRC_CHANGES" ]; then
            SRC_CHANGES="* Feature updates and signature synchronization."
          fi

          cat << EOF > release_body.md
          Latest build for **$MAJOR_VERSION** (Tracking \`$TAG\`)

          ### Compatibility
          | Property | Target Value |
          |:---|:---|
          | **Cheetos Version** | \`v${VERSION}\` |
          | **Target Game Version** | \`v${GAME_VERSION}\` |
          | **Compatible Steam Build ID** | \`${BUILD_ID}\` |
          | **Tracked Signatures** | \`${SIGS}\` bulletproof signatures |
          | **Release Commit** | [\`${COMMIT}\`](https://github.com/${REPO}/commit/${COMMIT}) |
          | **Package Archive** | \`${ZIP}\` (${ZIP_SIZE}) |

          ### Source Modifications
          $SRC_CHANGES

          ### File Checksums (SHA-256)
          \`\`\`text
          EOF

          cat checksums.txt >> release_body.md

          cat << EOF >> release_body.md
          \`\`\`

          **Full Commit History**: $COMPARE_LINK
          EOF

          cat release_body.md >> $GITHUB_STEP_SUMMARY

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAJOR_VERSION="${{ steps.meta.outputs.major }}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"

          # Create major release if it doesn't exist yet
          gh release create "$MAJOR_VERSION" --title "Cheetos $MAJOR_VERSION" --notes-file release_body.md || true

          # Update release title and notes
          gh release edit "$MAJOR_VERSION" --title "Cheetos $MAJOR_VERSION" --notes-file release_body.md

          # Remove old zip assets to avoid obsolete versions cluttering the release
          OLD_ASSETS=$(gh release view "$MAJOR_VERSION" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          for asset in $OLD_ASSETS; do
            if [[ "$asset" == *.zip ]] && [ "$asset" != "$ZIP_NAME" ]; then
              echo "Removing outdated asset: $asset"
              gh release delete-asset "$MAJOR_VERSION" "$asset" -y || true
            fi
          done

          # Upload release package and checksums
          echo "Uploading $ZIP_NAME and checksums.txt to release $MAJOR_VERSION..."
          gh release upload "$MAJOR_VERSION" "$ZIP_NAME" checksums.txt --clobber

          # Archive older major releases
          ALL_RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName')
          for rel in $ALL_RELEASES; do
            if [ "$rel" != "$MAJOR_VERSION" ]; then
              TITLE=$(gh release view "$rel" --json name -q '.name' 2>/dev/null || echo "")
              if [[ "$TITLE" != *"Archived"* ]]; then
                echo "Archiving older major release: $rel"
                gh release edit "$rel" --title "$rel (Archived)" || true
              fi
            fi
          done

      - name: Cleanup Old Full Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAJOR_VERSION="${{ steps.meta.outputs.major }}"
          echo "Managing patch tags for major release $MAJOR_VERSION..."

          git fetch --tags
          SPECIFIC_TAGS=$(git tag -l "${MAJOR_VERSION}.*" | sort -V)
          TAGS_ARRAY=($SPECIFIC_TAGS)
          TAGS_COUNT=${#TAGS_ARRAY[@]}

          # Retain only the latest 2 patch tags
          if [ "$TAGS_COUNT" -gt 2 ]; then
            DELETE_COUNT=$((TAGS_COUNT - 2))
            echo "Deleting $DELETE_COUNT older tags to retain latest 2..."
            for (( i=0; i<$DELETE_COUNT; i++ )); do
              TAG_TO_DELETE="${TAGS_ARRAY[$i]}"
              echo "Deleting tag: $TAG_TO_DELETE"
              git tag -d "$TAG_TO_DELETE" || true
              git push origin --delete "$TAG_TO_DELETE" || true
            done
          else
            echo "No tag cleanup needed ($TAGS_COUNT tags present)."
          fi
